name: tesi_rev
channels:
  - conda-forge
dependencies:
  - bzip2=1.0.8
  - ca-certificates
  - libexpat=2.8.0
  - libffi=3.4.8
  - openssl=3.5.6
  - packaging=26.0
  - pip
  - python=3.11.15
  - setuptools=82.0.1
  - sqlite=3.51.2
  - tk=8.6.15
  - tzdata=2026a
  - wheel=0.46.3
  - xz=5.8.2
  - zlib=1.3.1
  - pip:
      # torch/torchaudio/torchvision below are CUDA 11.8 wheels ("+cu118"), not on PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - et-xmlfile==2.0.0
      - imageio==2.37.4
      - lpips==0.1.4
      - matplotlib==3.11.1
      - opencv-python==5.0.0.93
      - openpyxl==3.1.5
      - pandas==3.0.5
      - pip==26.1.1
      - pyyaml
      - scipy==1.17.1
      - sympy==1.14.0
      - torch==2.7.1+cu118
      - torchaudio==2.7.1+cu118
      - torchvision==0.22.1+cu118
