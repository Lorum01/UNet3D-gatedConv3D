mode: infer

# Test 2025 (2 serie) per il modello resnet addestrato in questo workspace
# (split a finestra seed 424). Solo remap: (x+1)/2 -> [0,1].

paths:
  dataset_folder: "/home/basile/workdir/vona_backup_branch/Dataset_test_2025"
  excel_path: "/home/basile/workdir/vona_backup_branch/configs/test_2025/EventsTest2025.xlsx"

data:
  split_strategy: "by_class"
  input_length: 4
  prediction_length: 4
  stride: 1
  expected_input_shape: [4, 100, 100, 3]
  scale_to_neg1_pos1: true

dataloader:
  batch_size_train: 4
  batch_size_val: 4
  batch_size_test: 4

model:
  arch: resnet3d
  in_channels: 3
  out_channels: 3
  base_channels: 64
  num_down: 4
  blocks_per_stage: 3
  dropout: 0.2

infer:
  device: "cuda:0"
  checkpoint_path: "/home/basile/workdir/vona_legacy_window_split/Checkpoints_legacy_resnet3d_seed424/best_model.pth"
  save_dir_by_class_root: "Model_Results_test2025/legacy_resnet_seed424_remap/by_class"
  max_batches: 100000
  gif_fps: 2
  mean: null
  std: null
  denorm_from_neg1_pos1: true
  save_images: true
  save_gifs: true
  show_plots: false
