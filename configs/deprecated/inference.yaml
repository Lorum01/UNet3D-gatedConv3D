mode: infer

paths:
  dataset_dir: "./Dataset"
  excel_path: "./EventsEtnaCLASS_Final.xlsx"

dataset:
  input_length: 4
  prediction_length: 4
  stride: 1
  image_size: [100, 100]   # [H, W]
  channels: 3
  normalization:
    mode: "neg1pos1"       # none | neg1pos1 | standardize
    mean: null
    std: null
  split:
    strategy: "train_val_test"   # train_val_test | by_class
    seed: 424
    class_percentages:
      1: {train: 0.7, val: 0.15, test: 0.15}
      2: {train: 0.7, val: 0.15, test: 0.15}
      3: {train: 0.7, val: 0.15, test: 0.15}
      4: {train: 0.7, val: 0.15, test: 0.15}

dataloader:
  batch_size:
    train: 4
    val: 4
    test: 4

model:
  unet:
    in_channels: 3
    base_channels: 32
    num_levels: 5
    out_channels: 64
  stacked_conv:
    hidden_dims: [64, 128, 256, 512]
    kernel_size: 3
    padding: 1
  final_out_channels: 3

infer:
  device: "cuda"
  checkpoint_path: "./Checkpoints/convUnet_Best_Test_mod_1/best_model.pth"
  max_batches: 10
  gif_fps: 2
  # Se denorm_from_neg1_pos1 e' null: derivato automaticamente da dataset.normalization.mode
  # (comportamento consigliato). mean/std qui sotto servono solo se vuoi FORZARE
  # una denormalizzazione diversa da quella derivata da dataset.normalization.
  normalization_override:
    mean: null
    std: null
    denorm_from_neg1_pos1: true

  save:
    images: true
    gifs: true
    show_plots: false
    dirs:
      test: "Model_Results/Model_Results_1/test"
      val: "Model_Results/Model_Results_1/val"
      train: "Model_Results/Model_Results_1/train"

  # inferenza solo su dati di test
  run:
    test: true
    val: false
    train: false
