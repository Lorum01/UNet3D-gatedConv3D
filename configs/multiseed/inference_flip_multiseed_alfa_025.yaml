mode: infer

paths:
  dataset_dir: "./Dataset"
  excel_path: "./EventsEtnaCLASS_Final.xlsx"

dataset:
  input_length: 4
  prediction_length: 4
  stride: 1
  image_size: [100, 100]   # [H, W]
  channels: 3
  normalization:
    mode: "neg1pos1"       # deve combaciare con train_flip_multiseed_alfa_025.yaml
    mean: null
    std: null
  split:
    strategy: "train_val_test"   # stesso seed/percentuali di train_flip_multiseed_alfa_025.yaml -> stesso identico split
    seed: 424
    class_percentages:
      1: {train: 0.7, val: 0.15, test: 0.15}
      2: {train: 0.7, val: 0.15, test: 0.15}
      3: {train: 0.7, val: 0.15, test: 0.15}
      4: {train: 0.7, val: 0.15, test: 0.15}

dataloader:
  batch_size:
    train: 4
    val: 4
    test: 4

model:
  unet:
    in_channels: 3
    base_channels: 32
    num_levels: 5
    out_channels: 64
  stacked_conv:
    hidden_dims: [64, 128, 256, 512]
    kernel_size: 3
    padding: 1
  final_out_channels: 3

train:
  loss:
    alpha: 0.25

infer:
  device: "cuda"
  checkpoint_path: "./Checkpoints_flip_multiseed_alfa_025/best_model.pth"
  # Alto a sufficienza da coprire TUTTE le finestre generate dagli eventi
  # selezionati sotto (non e' un limite reale col numero di eventi cosi' basso).
  max_batches: 1000
  gif_fps: 2
  normalization_override:
    mean: null
    std: null
    denorm_from_neg1_pos1: true

  # Tiene solo i primi N eventi (cartelle) di ogni split (stesso ordine dello
  # split train/val/test); ogni evento tenuto viene mandato in inferenza per
  # intero, cioe' con TUTTE le finestre generate al suo interno.
  # se imposto a null, prende tutti gli eventi (cartelle) di quello split.
  events:
    train: null
    val: null
    test: null

  save:
    images: true
    gifs: true
    show_plots: false
    dirs:
      test: "Model_Results/flip_alfa_multiseed_025_best_model/test"
      val: "Model_Results/flip_alfa_multiseed_025_best_model/val"
      train: "Model_Results/flip_alfa_multiseed_025_best_model/train"

  run:
    test: true
    val: true
    train: true

#python scripts/run.py --config configs/inference_flip_multiseed_alfa_025.yaml
