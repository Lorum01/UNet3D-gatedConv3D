mode: infer

paths:
  dataset_dir: "./Dataset"
  excel_path: "./EventsEtnaCLASS_Final.xlsx"

dataset:
  input_length: 4
  prediction_length: 4
  stride: 1
  image_size: [100, 100]   # [H, W]
  channels: 3
  normalization:
    mode: "neg1pos1"       # deve combaciare con train_light.yaml
    mean: null
    std: null
  split:
    strategy: "train_val_test"   # stesso seed/percentuali di train_light.yaml -> stesso identico split
    seed: 424
    class_percentages:
      1: {train: 0.7, val: 0.15, test: 0.15}
      2: {train: 0.7, val: 0.15, test: 0.15}
      3: {train: 0.7, val: 0.15, test: 0.15}
      4: {train: 0.7, val: 0.15, test: 0.15}

dataloader:
  batch_size:
    train: 4
    val: 4
    test: 4

# Deve combaciare ESATTAMENTE con l'architettura usata in train_light.yaml,
# altrimenti il caricamento dello state_dict fallisce/da' mismatch.
model:
  unet:
    in_channels: 3
    base_channels: 16
    num_levels: 3
    out_channels: 32
  stacked_conv:
    hidden_dims: [32, 64]
    kernel_size: 3
    padding: 1
  final_out_channels: 3

infer:
  device: "cuda"
  checkpoint_path: "./Checkpoints_light/best_model.pth"   # best = minimo di val loss, non l'ultimo/overfittato
  max_batches: 10
  gif_fps: 2
  normalization_override:
    mean: null
    std: null
    denorm_from_neg1_pos1: true

  save:
    images: true
    gifs: true
    show_plots: false
    dirs:
      test: "Model_Results/Model_Results_light/test"
      val: "Model_Results/Model_Results_light/val"
      train: "Model_Results/Model_Results_light/train"

  # inferenza solo sui dati di TEST -> mai visti né in training né in validazione
  run:
    test: true
    val: false
    train: false
