mode: infer

paths:
  dataset_dir: "C:/Users/loren/Downloads/test_dataset_1"
  excel_path: "./EventsEtnaCLASS_Final.xlsx"

dataset:
  # Modalità richiesta: niente split train/val/test, solo raggruppamento per classe (da Excel)
  split:
    strategy: "by_class"   # train_val_test | by_class

  input_length: 4
  prediction_length: 4
  stride: 1
  image_size: [100, 100]   # [H, W]
  channels: 3
  normalization:
    mode: "neg1pos1"       # none | neg1pos1 | standardize
    # NOTE: se mode=standardize con split.strategy=by_class, mean/std qui sotto sono OBBLIGATORI.
    mean: null
    std: null

dataloader:
  batch_size:
    test: 4

model:
  unet:
    in_channels: 3
    base_channels: 32
    num_levels: 5
    out_channels: 64
  stacked_conv:
    hidden_dims: [64, 128, 256, 512]
    kernel_size: 3
    padding: 1
  final_out_channels: 3

infer:
  device: "cuda"
  checkpoint_path: "./Checkpoints/convUnet_Best_Test_mod_1/best_model.pth"
  max_batches: 10
  gif_fps: 2
  normalization_override:
    mean: null
    std: null
    # Se false fa il clamp a [0,1] invece di denormalizzare da [-1,1].
    denorm_from_neg1_pos1: true

  save:
    images: true
    gifs: true
    show_plots: false
    dirs:
      # Root output: `Model_Results/Model_Results_9/by_class/class_<id>/...`
      by_class_root: "Model_Results/Model_Results_10/by_class"

#python scripts/run.py --config configs/inference_by_class.yaml
